name: bootstrap
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  import:
    if: ${{ !contains(github.event.head_commit.message, 'Royal Vega') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Importar codigo
        run: |
          git fetch https://github.com/lu123zx/prueba royal-vega-src
          git checkout FETCH_HEAD -- .
          git config user.name "Luis"
          git config user.email "lu123zx@users.noreply.github.com"
          git add -A
          git commit -m "Royal Vega: casino privado con Supabase"
          git push
